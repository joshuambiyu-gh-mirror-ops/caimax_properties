name : Continuous Deployment
on: 
    workflow_run:
        workflows: ["Build and Push Docker Image"]
        types:
            - completed

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean up Docker resources
        run: |
          echo "Initial disk space:"
          df -h

          # First, stop and remove the specific container we know about
          echo "Stopping and removing existing caimax_client container..."
          sudo docker stop caimax_client || true
          sudo docker rm -f caimax_client || true

          # Then stop any other running containers
          echo "Stopping any other running containers..."
          sudo docker ps -q | xargs -r sudo docker stop || true

          # Remove all containers (just to be sure)
          echo "Removing all containers..."
          sudo docker container rm -f $(sudo docker container ls -aq) || true

          # Now that containers are stopped and removed, clean up everything else
          echo "Running system prune..."
          sudo docker system prune -a -f --volumes

          # Final verification - try to remove any remaining images
          echo "Removing any remaining images..."
          sudo docker image rm -f $(sudo docker image ls -q) || true

          echo "Final disk space:"
          df -h
          
          # Clean up system
          sudo apt-get clean
          sudo apt-get autoremove -y
          
          # Remove old logs
          sudo find /var/log -type f -name "*.log" -mtime +7 -delete
          sudo find /var/log -type f -name "*.gz" -mtime +7 -delete
          
          # Clean package manager caches
          sudo rm -rf /root/.npm /root/.cache/npm
          sudo rm -rf /root/.cache/yarn
          sudo rm -rf /root/.cache/pnpm
          
          # Show final disk space
          echo "Final disk space:"
          df -h

      - name: Pull Docker Image
        run: sudo docker pull joshuamumo/caimax_client:latest
      
      - name: Delete Old Docker Container
        run: sudo docker rm -f caimax_client || true
      - name: Create .env file from secrets
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
          echo "NEXT_GITHUB_CLIENT_ID=${{ secrets.NEXT_GITHUB_CLIENT_ID }}" >> .env
          echo "NEXT_GITHUB_CLIENT_SECRET=${{ secrets.NEXT_GITHUB_CLIENT_SECRET }}" >> .env
          echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> .env
          echo "NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}" >> .env
          echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}" >> .env
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env
          echo "AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}" >> .env
          echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env
          echo "AGENT_EMAIL=${{ secrets.AGENT_EMAIL }}" >> .env
          echo "SEND_FROM=${{ secrets.SEND_FROM }}" >> .env
          echo "NEXT_PUBLIC_AGENT_EMAIL=${{ secrets.NEXT_PUBLIC_AGENT_EMAIL }}" >> .env

      - name: Run Docker Container
        run: sudo docker run --env-file .env -d --name caimax_client -p 80:3000 -p 5555:5555 joshuamumo/caimax_client:latest
        