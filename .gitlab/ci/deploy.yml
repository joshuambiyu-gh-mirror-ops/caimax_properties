# ============================================================================
# DEPLOY STAGE: Continuous Deployment
# Equivalent to: .github/workflows/cd.yml
# Runs on self-hosted runner after successful build
# ============================================================================

deploy_to_production:
  stage: deploy
  tags:
    - docker
    - caimax-production
  rules:
    - if: $IMAGE_TAG
      when: on_success
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - when: never
  script:
    - echo "🚀 Starting deployment to production..."
    - export TAG="${IMAGE_TAG:-${CI_COMMIT_SHORT_SHA}}"
    - echo "Using image tag: ${TAG}"
    - export REPO="docker.io/joshuamumo/caimax_client"
    - echo "🛑 Stopping existing caimax_client container..."
    - sudo docker stop caimax_client || true
    - sudo docker rm -f caimax_client || true
    - |
      echo "🧹 Cleaning up Docker resources..."
      echo "Initial disk space:"
      df -h
      echo "Stopping other running containers..."
      sudo docker ps -q | xargs -r sudo docker stop || true
      echo "Removing old containers..."
      sudo docker container rm -f $(sudo docker container ls -aq) || true
      echo "Cleaning up Docker networks..."
      sudo docker network prune -f
      echo "Running system prune..."
      sudo docker system prune -a -f --volumes
      echo "Final disk space after cleanup:"
      df -h
    - echo "📥 Pulling Docker image ${REPO}:${TAG}..."
    - sudo docker pull ${REPO}:${TAG} || true
    - sudo docker pull ${REPO}:latest || true
    - echo "📝 Creating .env file..."
    - |
      cat > .env << EOF
      GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      NEXT_GITHUB_CLIENT_ID=${NEXT_GITHUB_CLIENT_ID}
      NEXT_GITHUB_CLIENT_SECRET=${NEXT_GITHUB_CLIENT_SECRET}
      NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      NEXTAUTH_URL=${NEXTAUTH_URL}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      DATABASE_URL=${DATABASE_URL}
      MAPBOX_TOKEN=${MAPBOX_TOKEN}
      AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      AWS_REGION=${AWS_REGION}
      AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      RESEND_API_KEY=${RESEND_API_KEY}
      AGENT_EMAIL=${AGENT_EMAIL}
      SEND_FROM=${SEND_FROM}
      NEXT_PUBLIC_AGENT_EMAIL=${NEXT_PUBLIC_AGENT_EMAIL}
      EOF
    - |
      echo "🔌 Checking for processes using port 80..."
      sudo lsof -i :80 || true
      sudo fuser -k 80/tcp || true
      sleep 5
    - |
      echo "▶️ Starting Docker container..."
      if ! sudo docker run --env-file .env -d --name caimax_client -p 80:3000 -p 5555:5555 ${REPO}:${TAG}; then
        echo "⚠️ First attempt failed, waiting 10 seconds and retrying..."
        sleep 10
        sudo docker run --env-file .env -d --name caimax_client -p 80:3000 -p 5555:5555 ${REPO}:${TAG}
      fi
      echo "✅ Container started successfully"
      sudo docker ps
  after_script:
    - echo "📊 Deployment summary:"
    - sudo docker logs caimax_client | tail -10 || true
